name: Build Windows EXE

# 触发条件：手动 / 推送到 main / 打 Tag
on:
  workflow_dispatch:        # 手动触发（网页点按钮）
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest   # 微软提供的 Windows Server 2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 稳定版本，兼容所有依赖
          cache: 'pip'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包（单文件 exe）
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name "WhatsAppTranslator" `
            --windowed `
            --collect-all deep_translator `
            --collect-all pystray `
            --collect-all PIL `
            --collect-submodules keyboard `
            --collect-submodules uiautomation `
            --collect-submodules comtypes `
            --hidden-import "deep_translator.google" `
            --hidden-import "pystray._win32" `
            --hidden-import "pystray._util" `
            main.py

      - name: 验证产物
        shell: pwsh
        run: |
          if (Test-Path "dist\WhatsAppTranslator.exe") {
            $size = (Get-Item "dist\WhatsAppTranslator.exe").Length / 1MB
            Write-Host "✅ 打包成功，文件大小: $([math]::Round($size,2)) MB"
          } else {
            Write-Host "❌ 未找到 exe 产物"
            exit 1
          }

      - name: 上传构建制品（可下载 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppTranslator-exe
          path: dist/WhatsAppTranslator.exe
          retention-days: 90
          if-no-files-found: error

      # 如果是打 Tag / Release，把 exe 附到 Release 上
      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhatsAppTranslator.exe
          name: WhatsAppTranslator ${{ github.ref_name }}
