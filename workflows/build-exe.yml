name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包（onedir 模式）
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean `
            --name "WhatsAppTranslator" `
            --windowed `
            --collect-all deep_translator `
            --collect-all pystray `
            --collect-all PIL `
            --collect-all keyboard `
            --collect-all uiautomation `
            --collect-all comtypes `
            --collect-all pywin32 `
            --collect-all requests `
            --collect-all yaml `
            --collect-all mss `
            --collect-all winsdk `
            --collect-all psutil `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module pandas `
            main.py

      - name: 验证产物
        shell: pwsh
        run: |
          if (Test-Path "dist\WhatsAppTranslator\WhatsAppTranslator.exe") {
            Write-Host "✅ 打包成功"
          } else {
            Write-Host "❌ 未找到 exe 产物"
            exit 1
          }

      - name: 打包文件夹为 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\WhatsAppTranslator\*" -DestinationPath "dist\WhatsAppTranslator.zip" -Force

      - name: 上传构建制品（zip 包）
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppTranslator-exe
          path: dist/WhatsAppTranslator.zip
          retention-days: 90
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhatsAppTranslator.zip
          name: WhatsAppTranslator ${{ github.ref_name }}
